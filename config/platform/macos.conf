# macOS platform layer. GNOME/Hyprland/BlackArch/gaming drivers and systemd based
# steps are platform-inapplicable and forced off here (see docs/FEATURE-PARITY.md).
MODULES=base,packages,dotfiles,terminal,shell,security,optimize,cleanup
GNOME_APPLY=no
GNOME_DEBLOAT=no
HYPRLAND=no
BLACKARCH=no
PKG_ALLOW_AUR=no
PKG_ALLOW_FLATPAK=no
BASE_MIRRORS=no
BASE_GPG_RESET=no
BASE_AUR_HELPER_INSTALL=no
GAMING_GPU=skip
SEC_HARDEN_SYSCTL=no
SEC_HARDEN_SSH=no
SEC_HARDENED_MODE=no
SEC_FIREJAIL_FIRECFG=no
