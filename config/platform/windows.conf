# Windows platform layer (loaded by setup.ps1 after defaults.conf).
# Linux/macOS-only modules are platform-inapplicable on Windows and documented
# as such in docs/FEATURE-PARITY.md -- they are NOT silently dropped.
MODULES=packages,gaming,security,optimize,cleanup
WIN_PACKAGE_SOURCE=winget
WIN_DEFENDER=report
WIN_POWER_PLAN=skip
PKG_ALLOW_AUR=no
PKG_ALLOW_FLATPAK=no
GNOME_APPLY=no
HYPRLAND=no
BLACKARCH=no
