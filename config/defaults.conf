# ArCoN v3.0 defaults (Linux/macOS). Do NOT edit — override in
#   ~/.config/arcon/arcon.conf, a profile, --config FILE or --set KEY=VALUE.
# Values are plain strings; they are never executed.

# ---- modules executed (order is fixed by ArCoN, this is only the selection)
MODULES=base,packages,gnome,gaming,blackarch,hyprland,dotfiles,terminal,shell,security,optimize,cleanup

# ---- preflight
MIN_DISK_GB=10
NET_CHECK_URLS=https://github.com https://archlinux.org https://www.debian.org
REQUIRE_NETWORK=yes

# ---- base (v2.5 Sector 1)
BASE_UPGRADE=yes
BASE_MIRRORS=yes                 # Arch: reflector benchmark (v2.5 live output)
BASE_MIRROR_COUNTRY=             # optional reflector --country
BASE_SPEEDTEST=yes               # v2.5 Cloudflare download test
BASE_GPG_RESET=no                # v2.5 always wiped /etc/pacman.d/gnupg; v3 opt-in (risk high)
BASE_AUR_HELPER_INSTALL=yes
AUR_HELPER=yay
PACMAN_STALE_LOCK=ask            # ask | remove | abort

# ---- packages (v2.5 Sector 3)
PKG_GROUPS=essentials            # essentials,media,cyber,remote,power
PKG_CUSTOM_FILE=pacs.txt
PKG_USE_CUSTOM=ask               # ask | yes | no
PKG_ALLOW_AUR=yes
PKG_ALLOW_FLATPAK=no
PKG_EXTRA=

# ---- GNOME (v2.5 Sector 2A)
GNOME_APPLY=no
GNOME_DEBLOAT=no
GNOME_WALLPAPER=Katana.jpg
GNOME_RESET_APP_FOLDERS=yes

# ---- gaming (v2.5 Sector 2B — no longer requires GNOME)
GAMING=no
GAMING_GPU=auto                  # auto | nvidia | amd | intel | skip
GAMING_NVIDIA_KMOD=yes           # install kernel module package (nvidia-open / dkms)
GAMING_EXTRAS=                   # mangohud,lutris,vulkan-tools
GAMING_ENABLE_MULTILIB=yes
GAMING_GAMEMODE_CONFIG=yes

# ---- BlackArch (v2.5 Sector 4, Arch only)
BLACKARCH=no                     # no | enable | core | full | remove
BLACKARCH_OVERWRITE=no           # v2.5 always used --overwrite '*'
BLACKARCH_PROVIDER_FIX=yes       # jdk17/jdk11/rust/opencl-mesa (v2.5 provider-lock fix)

# ---- Hyprland (v2.5 Sector 6)
HYPRLAND=no
HYPR_THEME=default               # none | default | ax-shell | hyde | ml4w | jakoolit
HYPR_EDIT_INSTALLER=no

# ---- dotfiles (v2.5 Sector 7)
DOTFILES_WALLPAPERS=yes
DOTFILES_TERMINATOR=yes

# ---- terminal / shell (v2.5 Sector 8)
TERM_EMULATOR=skip
TERM_THEME=Dracula
SHELL_TARGET=skip
SHELL_ZSH_THEME=agnoster
SHELL_STARSHIP_PRESET=default
SHELL_CHSH=yes
SHELL_FONT=yes

# ---- security (v2.5 Sector 9)
SEC_TOOLS=no
SEC_FIREWALL=no
SEC_SCAN=no
SEC_HARDEN_SYSCTL=no
SEC_HARDEN_SSH=no
SEC_SSH_DISABLE_PASSWORD=no
SEC_HARDENED_MODE=no             # OpenSnitch + USBGuard
SEC_FIREJAIL_FIRECFG=no

# ---- optimization (v2.5 Sector 9 + final cleanup)
OPT_PROFILE=minimal              # minimal | balanced | performance | gaming | developer | security | custom
OPT_INCLUDE=
OPT_EXCLUDE=

# ---- cleanup / end of run
CLEANUP=no
REBOOT=no

# ---- theme sources (pinned commits; override to update)
# v2.5 used dexpota/kitty-themes with names containing spaces -> every download was a 404
KITTY_THEMES_REPO=https://raw.githubusercontent.com/kovidgoyal/kitty-themes
KITTY_THEMES_REF=b95a97da1fad87263452590d74212499bd120de7
ALACRITTY_THEMES_REPO=https://raw.githubusercontent.com/alacritty/alacritty-theme
ALACRITTY_THEMES_REF=ab88d5a80d676b5dc6157e91aba8067f2078dc94
OHMYZSH_REPO=https://github.com/ohmyzsh/ohmyzsh
ZSH_AUTOSUGGESTIONS_REPO=https://github.com/zsh-users/zsh-autosuggestions
ZSH_SYNTAX_REPO=https://github.com/zsh-users/zsh-syntax-highlighting
POWERLEVEL10K_REPO=https://github.com/romkatv/powerlevel10k
